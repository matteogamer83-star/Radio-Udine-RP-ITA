<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f78e0"/>
      <stop offset="1" stop-color="#0a2250"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc55"/>
      <stop offset="1" stop-color="#e2a600"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- onde radio -->
  <g fill="none" stroke="#ffdc55" stroke-width="20" stroke-linecap="round">
    <path d="M357 58 A62 62 0 0 1 357 134"/>
    <path d="M394 26 A110 110 0 0 1 394 166" opacity=".75"/>
  </g>
  <!-- antenna -->
  <rect x="292" y="56" width="34" height="140" rx="17" fill="url(#gd)"/>
  <!-- tasto laterale -->
  <rect x="128" y="238" width="30" height="84" rx="10" fill="#e2a600"/>
  <!-- corpo -->
  <rect x="148" y="170" width="212" height="292" rx="46" fill="url(#gd)"/>
  <!-- griglia altoparlante -->
  <g stroke="#0a2250" stroke-width="15" stroke-linecap="round">
    <line x1="194" y1="218" x2="314" y2="218"/>
    <line x1="194" y1="250" x2="314" y2="250"/>
    <line x1="194" y1="282" x2="314" y2="282"/>
  </g>
  <!-- display -->
  <rect x="182" y="318" width="144" height="110" rx="18" fill="#0a2250"/>
  <text x="254" y="396" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" fill="#ffdc55">UD</text>
</svg>
