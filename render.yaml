# Pubblicazione gratuita su https://render.com (link fisso https, sempre raggiungibile)
services:
  - type: web
    name: radio-udine-rp
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/info
    envVars:
      # Token GitHub con permesso "gist": salva account, ruoli e canali in modo permanente
      - key: GITHUB_TOKEN
        sync: false
      # Codice per creare il Founder alla prima accensione (scegline uno tu)
      - key: SETUP_CODE
        sync: false
